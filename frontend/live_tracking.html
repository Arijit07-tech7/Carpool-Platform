<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking — RideSync</title>
  <meta name="description" content="Track your ride in real-time on RideSync">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --blue:#1677ff;--blue-dark:#075ed7;--blue-light:#eaf3ff;
      --text:#11151b;--muted:#737d8c;--border:#e7ebf0;--bg:#f7f9fc;--white:#fff;
      --green:#20a464;--orange:#ef8a22;--red:#df4d4d;
    }
    body{font-family:"Inter",sans-serif;color:var(--text);background:var(--bg);overflow:hidden;height:100vh}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}

    .layout{display:grid;grid-template-columns:380px 1fr;height:100vh}

    /* SIDE PANEL */
    .side-panel{background:white;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .side-header{padding:24px 24px 20px;border-bottom:1px solid var(--border)}
    .back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:18px;text-decoration:none;transition:color .2s}
    .back-btn:hover{color:var(--blue)}
    .tracking-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(32,164,100,.1);color:var(--green);border-radius:100px;font-size:11px;font-weight:800;margin-bottom:16px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
    .trip-title{font-size:18px;font-weight:900;letter-spacing:-.3px;margin-bottom:4px}
    .trip-sub{font-size:12px;color:var(--muted)}

    .side-body{flex:1;overflow-y:auto;padding:20px 24px}

    /* ROUTE CARD */
    .route-card{background:var(--bg);border-radius:16px;padding:20px;margin-bottom:20px}
    .route-step{display:flex;gap:14px;align-items:flex-start}
    .route-step+.route-step{margin-top:16px}
    .step-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px}
    .dot-green{background:var(--green)}
    .dot-red{background:var(--red)}
    .step-info{}
    .step-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--muted)}
    .step-value{font-size:14px;font-weight:800;color:var(--text);margin-top:2px}
    .route-line{width:2px;height:24px;background:var(--border);margin-left:5px;margin-top:4px}

    /* DRIVER CARD */
    .driver-card{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
    .driver-card-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--muted);margin-bottom:14px}
    .driver-info{display:flex;align-items:center;gap:14px}
    .driver-avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#111,#30343b);color:white;font-size:18px;font-weight:800;display:grid;place-items:center}
    .driver-name{font-size:15px;font-weight:800}
    .driver-meta{font-size:12px;color:var(--muted);margin-top:3px}

    /* STATS GRID */
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .stat-box{background:var(--bg);border-radius:13px;padding:14px;text-align:center}
    .stat-box-val{font-size:20px;font-weight:900;color:var(--text)}
    .stat-box-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}

    /* STATUS TIMELINE */
    .timeline{display:flex;flex-direction:column;gap:0}
    .tl-item{display:flex;gap:14px;position:relative;padding-bottom:16px}
    .tl-item:last-child{padding-bottom:0}
    .tl-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;border:2px solid var(--border);background:white}
    .tl-dot.done{background:var(--green);border-color:var(--green);color:white}
    .tl-dot.active{background:var(--blue);border-color:var(--blue);color:white;animation:dotPulse 1.5s infinite}
    @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,119,255,.4)}50%{box-shadow:0 0 0 8px rgba(22,119,255,0)}}
    .tl-line{position:absolute;left:13px;top:28px;width:2px;background:var(--border);height:calc(100% - 28px)}
    .tl-item.done .tl-line{background:var(--green)}
    .tl-content{padding-top:4px}
    .tl-title{font-size:13px;font-weight:800}
    .tl-time{font-size:11px;color:var(--muted);margin-top:2px}

    /* ACTIONS */
    .action-bar{padding:20px 24px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
    .btn-danger{width:100%;padding:13px;border-radius:12px;border:1.5px solid rgba(223,77,77,.2);background:rgba(223,77,77,.05);color:var(--red);font-size:13px;font-weight:800;cursor:pointer;transition:all .2s}
    .btn-danger:hover{background:var(--red);color:white;border-color:var(--red)}
    .btn-chat{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:white;color:var(--text);font-size:13px;font-weight:800;cursor:pointer;transition:all .2s}
    .btn-chat:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}

    /* MAP AREA */
    .map-area{position:relative}
    #trackingMap{width:100%;height:100vh}

    /* ETA BUBBLE */
    .eta-bubble{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:white;border-radius:16px;padding:16px 24px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;align-items:center;gap:24px;border:1px solid var(--border)}
    .eta-item{text-align:center}
    .eta-val{font-size:20px;font-weight:900}
    .eta-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
    .eta-divider{width:1px;height:36px;background:var(--border)}

    /* NO TRIP */
    .no-trip{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;gap:16px;color:var(--muted)}

    @media(max-width:768px){
      .layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .side-panel{height:auto;overflow:visible}
      #trackingMap{height:50vh}
      .side-body{max-height:300px}
      .layout{overflow-y:auto;height:auto}
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- SIDE PANEL -->
  <div class="side-panel">
    <div class="side-header">
      <a href="my-trips.html" class="back-btn">← Back to Trips</a>
      <div class="tracking-badge"><div class="live-dot"></div> LIVE TRACKING</div>
      <div class="trip-title" id="tripTitle">Loading trip...</div>
      <div class="trip-sub" id="tripSub">Fetching details...</div>
    </div>

    <div class="side-body">

      <!-- ROUTE -->
      <div class="route-card">
        <div class="route-step">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div class="step-dot dot-green"></div>
            <div class="route-line"></div>
          </div>
          <div class="step-info">
            <div class="step-label">From</div>
            <div class="step-value" id="fromLocation">—</div>
          </div>
        </div>
        <div class="route-step">
          <div class="step-dot dot-red"></div>
          <div class="step-info">
            <div class="step-label">To</div>
            <div class="step-value" id="toLocation">—</div>
          </div>
        </div>
      </div>

      <!-- DRIVER INFO -->
      <div class="driver-card">
        <div class="driver-card-title">👤 Driver</div>
        <div class="driver-info">
          <div class="driver-avatar" id="driverAvatar">D</div>
          <div>
            <div class="driver-name" id="driverName">Loading...</div>
            <div class="driver-meta" id="driverMeta">—</div>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-val" id="etaVal">—</div>
          <div class="stat-box-label">ETA (min)</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="distVal">—</div>
          <div class="stat-box-label">Distance</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="fareVal">—</div>
          <div class="stat-box-label">Fare</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="seatsVal">—</div>
          <div class="stat-box-label">Seats</div>
        </div>
      </div>

      <!-- TIMELINE -->
      <div class="driver-card">
        <div class="driver-card-title">📍 Trip Status</div>
        <div class="timeline" id="timeline">
          <div class="tl-item">
            <div style="position:relative"><div class="tl-dot done">✓</div><div class="tl-line"></div></div>
            <div class="tl-content"><div class="tl-title">Booking Confirmed</div><div class="tl-time" id="tl-booked">—</div></div>
          </div>
          <div class="tl-item">
            <div style="position:relative"><div class="tl-dot" id="tl-dot-pickup">🚗</div><div class="tl-line"></div></div>
            <div class="tl-content"><div class="tl-title">Driver En Route</div><div class="tl-time" id="tl-enroute">Waiting...</div></div>
          </div>
          <div class="tl-item">
            <div style="position:relative"><div class="tl-dot" id="tl-dot-started">🛣️</div><div class="tl-line"></div></div>
            <div class="tl-content"><div class="tl-title">Trip Started</div><div class="tl-time" id="tl-started">Waiting...</div></div>
          </div>
          <div class="tl-item">
            <div style="position:relative"><div class="tl-dot" id="tl-dot-done">🏁</div></div>
            <div class="tl-content"><div class="tl-title">Arrived</div><div class="tl-time" id="tl-arrived">Waiting...</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-chat" onclick="API.toast('Chat coming soon!', 'info')">💬 Message Driver</button>
      <button class="btn-danger" onclick="confirmCancel()">✕ Cancel Trip</button>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-area">
    <div id="trackingMap"></div>
    <div class="eta-bubble">
      <div class="eta-item">
        <div class="eta-val" id="etaBubble">—</div>
        <div class="eta-label">ETA (min)</div>
      </div>
      <div class="eta-divider"></div>
      <div class="eta-item">
        <div class="eta-val" id="distBubble">—</div>
        <div class="eta-label">km left</div>
      </div>
      <div class="eta-divider"></div>
      <div class="eta-item">
        <div class="eta-val" id="statusBubble" style="font-size:13px">Loading</div>
        <div class="eta-label">Status</div>
      </div>
    </div>
  </div>

</div>

<!-- Socket.IO (from backend) -->
<script src="http://localhost:5000/socket.io/socket.io.js"></script>
<!-- Google Maps -->
<script>
  let map, driverMarker, pickupMarker, destMarker, directionsService, directionsRenderer;
  let tripId = null;
  let pollInterval = null;

  function initMap() {
    map = new google.maps.Map(document.getElementById('trackingMap'), {
      center: { lat: 22.5726, lng: 88.3639 },
      zoom: 13,
      styles: [{ featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }]
    });
    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({
      suppressMarkers: true,
      polylineOptions: { strokeColor: '#1677ff', strokeWeight: 5 }
    });
    directionsRenderer.setMap(map);
  }

  function updateDriverMarker(lat, lng) {
    const pos = { lat, lng };
    if (!driverMarker) {
      driverMarker = new google.maps.Marker({
        position: pos,
        map,
        icon: {
          url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18" fill="#1677ff" stroke="white" stroke-width="3"/>
              <text x="20" y="26" text-anchor="middle" font-size="18" fill="white">🚗</text>
            </svg>`),
          scaledSize: new google.maps.Size(40, 40),
          anchor: new google.maps.Point(20, 20)
        },
        title: 'Driver Location'
      });
    } else {
      driverMarker.setPosition(pos);
    }
    map.panTo(pos);
  }

  function showRoute(pickup, dest) {
    directionsService.route({
      origin: pickup,
      destination: dest,
      travelMode: google.maps.TravelMode.DRIVING
    }, (result, status) => {
      if (status === 'OK') {
        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];
        document.getElementById('etaVal').textContent = Math.ceil(leg.duration.value / 60);
        document.getElementById('distVal').textContent = (leg.distance.value / 1000).toFixed(1) + 'km';
        document.getElementById('etaBubble').textContent = Math.ceil(leg.duration.value / 60);
        document.getElementById('distBubble').textContent = (leg.distance.value / 1000).toFixed(1);
      }
    });
  }
</script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCV0e64xLCJgtbwo2WB_mBVwJDOzda26CQ&callback=initMap"
  onerror="console.warn('Maps API unavailable')">
</script>

<script src="api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    API.requireAuth();

    const params = new URLSearchParams(window.location.search);
    tripId = params.get('tripId') || params.get('id');

    if (!tripId) {
      document.getElementById('tripTitle').textContent = 'No trip specified';
      document.getElementById('tripSub').textContent = 'Go back and select a trip to track.';
      return;
    }

    await loadTripDetails();
    startTracking();
  });

  async function loadTripDetails() {
    try {
      const res = await API.get(`/trips/${tripId}`);
      const trip = res.data || res.trip || res;

      document.getElementById('tripTitle').textContent = `Trip #${tripId.slice(0, 8)}`;
      document.getElementById('tripSub').textContent = `Status: ${trip.status || 'IN_PROGRESS'}`;

      const from = trip.originName || trip.ride?.pickupLocation || trip.pickupLocation || 'Pickup Point';
      const to = trip.destinationName || trip.ride?.destination || trip.destination || 'Destination';

      document.getElementById('fromLocation').textContent = from;
      document.getElementById('toLocation').textContent = to;
      document.getElementById('fareVal').textContent = trip.fare ? `₹${trip.fare}` : '—';
      document.getElementById('seatsVal').textContent = trip.passengers?.length || trip.seats || '—';
      document.getElementById('statusBubble').textContent = trip.status || 'ACTIVE';

      // Driver info
      const driver = trip.driver || trip.ride?.driver || {};
      document.getElementById('driverName').textContent = driver.name || 'Driver';
      document.getElementById('driverMeta').textContent = driver.phone || driver.email || '—';
      document.getElementById('driverAvatar').textContent = (driver.name || 'D').charAt(0).toUpperCase();

      // Timeline
      if (trip.createdAt) document.getElementById('tl-booked').textContent = new Date(trip.createdAt).toLocaleTimeString();
      if (trip.startTime) {
        document.getElementById('tl-dot-started').classList.add('done');
        document.getElementById('tl-dot-started').textContent = '✓';
        document.getElementById('tl-started').textContent = new Date(trip.startTime).toLocaleTimeString();
      }

      // Show map route
      if (trip.ride) {
        const r = trip.ride;
        const pickup = { lat: r.pickupLat || 22.5726, lng: r.pickupLng || 88.3639 };
        const dest = { lat: r.destinationLat || 22.6, lng: r.destinationLng || 88.4 };
        setTimeout(() => { if (typeof showRoute === 'function') showRoute(pickup, dest); }, 2000);
      }
    } catch(err) {
      console.error(err);
      document.getElementById('tripSub').textContent = err.message;
    }
  }

  function startTracking() {
    // Poll live location every 5s
    pollLocation();
    pollInterval = setInterval(pollLocation, 5000);

    // Socket.IO real-time events
    try {
      const socket = io('http://localhost:5000');
      const token = API.getToken();
      if (token) socket.emit('authenticate', { token });

      socket.on('location:update', (data) => {
        if (data.tripId === tripId && data.lat && data.lng) {
          if (typeof updateDriverMarker === 'function') updateDriverMarker(data.lat, data.lng);
        }
      });

      socket.on('trip:status', (data) => {
        if (data.tripId === tripId) {
          document.getElementById('statusBubble').textContent = data.status;
          document.getElementById('tripSub').textContent = `Status: ${data.status}`;
          if (data.status === 'COMPLETED') {
            clearInterval(pollInterval);
            API.toast('Trip completed! 🎉', 'success');
            setTimeout(() => { window.location.href = 'ride-history.html'; }, 2000);
          }
        }
      });
    } catch(e) {
      console.warn('Socket.IO not available:', e.message);
    }
  }

  async function pollLocation() {
    try {
      const res = await API.tracking.getLiveLocation(tripId);
      const loc = res.data || res;
      if (loc.lat && loc.lng && typeof updateDriverMarker === 'function') {
        updateDriverMarker(loc.lat, loc.lng);
      }
    } catch(e) {
      // Silently ignore — driver may not have started sharing location
    }
  }

  function confirmCancel() {
    if (confirm('Are you sure you want to cancel this trip?')) {
      API.patch(`/trips/${tripId}/cancel`, {})
        .then(() => {
          API.toast('Trip cancelled', 'info');
          clearInterval(pollInterval);
          setTimeout(() => { window.location.href = 'my-trips.html'; }, 1500);
        })
        .catch(err => API.toast(err.message, 'error'));
    }
  }
</script>
</body>
</html>
