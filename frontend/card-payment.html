```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Payment — RideSync</title>

    <link rel="stylesheet" href="payment-summary.css">

    <style>
        .payment-container {
            width: min(560px, 100%);
            margin: auto;
        }

        .payment-card {
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255, 255, 255, .86);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg);
        }

        .payment-icon {
            width: 58px;
            height: 58px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: linear-gradient(135deg, var(--blue), var(--blue-light));
            color: white;
            font-size: 21px;
            font-weight: 800;
            box-shadow: 0 12px 28px rgba(37, 99, 235, .22);
        }

        .payment-card h2 {
            margin-top: 8px;
            color: var(--text);
            font-size: 27px;
            font-weight: 800;
        }

        .payment-card>p {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .amount-box {
            margin: 25px 0;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-blue);
            border-radius: 16px;
            background: var(--blue-pale);
        }

        .amount-box span {
            color: var(--text-muted);
            font-size: 9px;
        }

        .amount-box strong {
            display: block;
            margin-top: 7px;
            color: var(--blue);
            font-size: 30px;
        }

        .field {
            margin-top: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-size: 10px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            border: 1px solid var(--border-blue);
            border-radius: 11px;
            outline: none;
            background: white;
            color: var(--text);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .08);
        }

        .pay-btn {
            width: 100%;
            height: 51px;
            margin-top: 23px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--blue-light));
            color: white;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(37, 99, 235, .22);
        }

        .back-link {
            display: block;
            margin-top: 17px;
            text-align: center;
            color: var(--blue);
            font-size: 10px;
            font-weight: 700;
        }

        @media(max-width:500px) {
            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <div class="page">

        <header class="header">

            <a href="payment-method.html" class="back-btn">
                ←
            </a>

            <div class="header-title">

                <span>RideSync Payments</span>

                <h1>Card Payment</h1>

            </div>

            <div class="secure">
                <span class="secure-dot"></span>
                Secure
            </div>

        </header>


        <main class="main">

            <div class="payment-container">

                <div class="payment-card">

                    <div class="payment-icon">
                        CARD
                    </div>

                    <div class="eyebrow">
                        Payment Method
                    </div>

                    <h2>
                        Pay with Card
                    </h2>

                    <p>
                        Enter your card details to complete
                        the RideSync payment.
                    </p>


                    <div class="amount-box">

                        <span>
                            TOTAL AMOUNT
                        </span>

                        <strong>
                            ₹180
                        </strong>

                    </div>


                    <form id="cardForm">

                        <div class="field">

                            <label>
                                Card Number
                            </label>

                            <input type="text" maxlength="19" placeholder="1234 5678 9012 3456" required>

                        </div>


                        <div class="field">

                            <label>
                                Cardholder Name
                            </label>

                            <input type="text" placeholder="Enter name" required>

                        </div>


                        <div class="field-row">

                            <div class="field">

                                <label>
                                    Expiry
                                </label>

                                <input type="text" maxlength="5" placeholder="MM/YY" required>

                            </div>


                            <div class="field">

                                <label>
                                    CVV
                                </label>

                                <input type="password" maxlength="3" placeholder="•••" required>

                            </div>

                        </div>


                        <button type="submit" class="pay-btn">
                            Pay ₹180 →
                        </button>

                    </form>


                    <a href="payment-method.html" class="back-link">
                        ← Choose another payment method
                    </a>

                </div>

            </div>

        </main>

    </div>


    <script>

        document
            .getElementById("cardForm")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                localStorage.setItem(
                    "ridesyncPaymentMethod",
                    "card"
                );

                localStorage.setItem(
                    "ridesyncPaymentStatus",
                    "success"
                );

                localStorage.setItem(
                    "ridesyncTransactionId",
                    "RSCARD" + Date.now()
                );

                localStorage.setItem("ridesyncMobile", "+91 ••••• ••4587");
                window.location.href = "card-otp.html";
            });

    </script>

</body>

</html>
```
