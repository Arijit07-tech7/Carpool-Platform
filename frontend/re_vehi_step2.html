<script>

    const vehicleForm =
        document.getElementById("vehicleForm");


    /*
     * Form Submission
     */
    vehicleForm.addEventListener("submit", function (event) {

        event.preventDefault();


        const brand =
            document.getElementById("vehicleBrand").value;

        const model =
            document.getElementById("vehicleModel").value.trim();

        const year =
            document.getElementById("registrationYear").value;

        const color =
            document.getElementById("vehicleColor").value.trim();

        const purpleFleet =
            document.getElementById("purpleFleet").checked;


        /*
         * Basic validation
         */
        if (!brand) {

            alert("Please select your vehicle brand.");

            return;
        }


        if (!model) {

            alert("Please enter your vehicle model.");

            return;
        }


        if (!year) {

            alert("Please select the registration year.");

            return;
        }


        if (!color) {

            alert("Please enter the vehicle color.");

            return;
        }


        /*
         * Save data locally.
         * This can later be replaced by
         * your backend/API.
         */
        const vehicleData = {

            brand: brand,

            model: model,

            registrationYear: year,

            color: color,

            purpleFleet: purpleFleet

        };


        localStorage.setItem(
            "ridesync_vehicle_details",
            JSON.stringify(vehicleData)
        );


        /*
         * Continue to Documents
         */
        alert(
            "Vehicle details saved successfully!\n\n" +
            "Proceeding to document verification."
        );


        /*
         * Replace this with your actual
         * Step 3 URL when available.
         *
         * Example:
         * window.location.href = "documents.html";
         */
    });


    /*
     * Back to Profile
     */
    function goBack() {

        if (window.history.length > 1) {

            window.history.back();

        } else {

            alert(
                "No previous page is available."
            );

        }

    }


    /*
     * Close Button
     */
    function closePage() {

        if (window.history.length > 1) {

            window.history.back();

        } else {

            alert(
                "You can close this page using your browser."
            );

        }

    }

</script>
