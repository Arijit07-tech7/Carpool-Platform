<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offer Ride — RideSync</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#1769ff;
    --blue-soft:#eef5ff;
    --black:#080b10;
    --text:#111827;
    --muted:#6b7280;
    --border:#e7ebf1;
    --success:#16a34a;
    --shadow:0 20px 60px rgba(15,23,42,.08);
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f7f9fc;
    color:var(--text);
}

.navbar{
    height:76px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
    font-size:22px;
}

.logo-box{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#080b10;
    color:#fff;
    display:grid;
    place-items:center;
}

.logo span{
    color:var(--blue);
}

.nav{
    display:flex;
    gap:7px;
}

.nav a{
    text-decoration:none;
    color:#697280;
    font-size:14px;
    font-weight:700;
    padding:10px 14px;
    border-radius:10px;
}

.nav a:hover,
.nav a.active{
    color:var(--blue);
    background:var(--blue-soft);
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#edf4ff;
    color:var(--blue);
    font-weight:900;
}

.page{
    max-width:1320px;
    margin:auto;
    padding:45px 5% 70px;
}

.eyebrow{
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--blue);
}

h1{
    font-size:42px;
    letter-spacing:-1.8px;
    margin:7px 0;
}

.subtitle{
    color:var(--muted);
    font-size:15px;
    margin-bottom:30px;
}

.switch{
    display:flex;
    width:max-content;
    padding:5px;
    border-radius:15px;
    background:#edf1f6;
    margin-bottom:25px;
}

.switch a{
    text-decoration:none;
    padding:12px 25px;
    border-radius:11px;
    color:#697280;
    font-size:14px;
    font-weight:800;
}

.switch a.active{
    color:white;
    background:#080b10;
}

.grid{
    display:grid;
    grid-template-columns:460px 1fr;
    gap:25px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    padding:27px;
    box-shadow:var(--shadow);
}

.card h2{
    font-size:19px;
    margin-bottom:23px;
}

.location{
    position:relative;
    margin-bottom:13px;
}

.location label,
.field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:900;
    color:#737c88;
    margin-bottom:7px;
}

.input{
    height:58px;
    border:1px solid #dfe5ed;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 14px;
}

.input:focus-within{
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(23,105,255,.08);
}

.input input{
    width:100%;
    border:0;
    outline:0;
    font-size:14px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    border:3px solid var(--blue);
}

.dot.black{
    border-color:#111827;
}

.swap{
    position:absolute;
    right:18px;
    top:67px;
    z-index:10;
    width:39px;
    height:39px;
    border-radius:50%;
    border:1px solid #dce3ec;
    background:#fff;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.swap:hover{
    transform:rotate(180deg);
    color:var(--blue);
}

.suggestions{
    position:absolute;
    left:0;
    right:0;
    top:78px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 18px 40px rgba(0,0,0,.12);
    z-index:50;
    display:none;
    overflow:hidden;
}

.suggestion{
    padding:13px;
    display:flex;
    gap:12px;
    cursor:pointer;
}

.suggestion:hover{
    background:#f5f7fa;
}

.icon{
    width:35px;
    height:35px;
    border-radius:10px;
    background:var(--blue-soft);
    color:var(--blue);
    display:grid;
    place-items:center;
}

.suggestion strong{
    display:block;
    font-size:13px;
}

.suggestion small{
    color:#8b939e;
    font-size:11px;
}

.current{
    width:100%;
    border:1px dashed #b7c6df;
    background:#f6f9ff;
    color:var(--blue);
    padding:11px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-weight:800;
    margin:3px 0 20px;
}

.fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.field input,
.field select{
    width:100%;
    height:52px;
    border:1px solid #dfe5ed;
    border-radius:13px;
    padding:0 13px;
    outline:none;
    background:#fff;
}

.field input:focus,
.field select:focus{
    border-color:var(--blue);
}

.vehicle{
    margin-top:18px;
}

.vehicle select{
    width:100%;
    height:52px;
    border:1px solid #dfe5ed;
    border-radius:13px;
    padding:0 13px;
}

.fare{
    margin-top:18px;
}

.offer-btn{
    width:100%;
    height:57px;
    border:0;
    border-radius:14px;
    margin-top:20px;
    background:#080b10;
    color:#fff;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.offer-btn:hover{
    background:var(--blue);
    transform:translateY(-1px);
}

.map-card{
    min-height:650px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    overflow:hidden;
    box-shadow:var(--shadow);
    position:relative;
}

.map-head{
    position:absolute;
    z-index:10;
    top:20px;
    left:20px;
    right:20px;
    padding:14px 16px;
    border-radius:15px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);
    border:1px solid #e7ebf1;
    display:flex;
    justify-content:space-between;
}

.map-head strong{
    font-size:13px;
}

.map-head span{
    color:var(--success);
    font-size:11px;
    font-weight:900;
}

.map{
    height:650px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(30deg,transparent 48%,#d9e0e8 49%,#d9e0e8 51%,transparent 52%) 0 0/130px 130px,
        linear-gradient(-30deg,transparent 48%,#d9e0e8 49%,#d9e0e8 51%,transparent 52%) 0 0/150px 150px,
        linear-gradient(90deg,#f4f6f8 2px,transparent 2px) 0 0/90px 90px,
        #eef1f4;
}

.road{
    position:absolute;
    width:120%;
    height:35px;
    background:white;
    box-shadow:0 0 0 1px #dfe3e7;
    left:-10%;
    top:50%;
    transform:rotate(-18deg);
}

.road.r2{
    top:34%;
    transform:rotate(35deg);
}

.road.r3{
    top:67%;
    transform:rotate(5deg);
}

.route{
    position:absolute;
    left:24%;
    top:47%;
    width:55%;
    height:7px;
    background:var(--blue);
    border-radius:20px;
    transform:rotate(-18deg);
    box-shadow:0 0 20px rgba(23,105,255,.35);
    display:none;
}

.pin{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:5px solid white;
    color:#fff;
    font-weight:900;
    display:none;
    place-items:center;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.pin.a{
    left:24%;
    top:45%;
    background:var(--blue);
}

.pin.b{
    right:19%;
    top:28%;
    background:#080b10;
}

.empty{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#8a929d;
}

.empty div{
    font-size:35px;
}

.empty strong{
    display:block;
    color:#505865;
    font-size:14px;
    margin:7px 0;
}

.empty span{
    font-size:11px;
}

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#080b10;
    color:white;
    padding:14px 18px;
    border-radius:12px;
    opacity:0;
    transform:translateY(80px);
    transition:.3s;
    z-index:999;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:950px){

    .nav{
        display:none;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .map-card,
    .map{
        min-height:500px;
        height:500px;
    }
}

@media(max-width:600px){

    .page{
        padding:30px 15px;
    }

    h1{
        font-size:32px;
    }

    .card{
        padding:19px;
    }

    .fields{
        grid-template-columns:1fr;
    }

    .switch{
        width:100%;
    }

    .switch a{
        flex:1;
        text-align:center;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">

        <div class="logo-box">R</div>

        Ride<span>Sync</span>

    </div>

    <nav class="nav">

        <a href="#" class="active">
            Carpooling
        </a>

        <a href="#">
            My Trips
        </a>

        <a href="#">
            My Vehicle
        </a>

        <a href="#">
            Ride History
        </a>

        <a href="#">
            Wallet
        </a>

        <a href="#">
            Settings
        </a>

    </nav>

    <div class="profile">
        A
    </div>

</header>


<main class="page">

    <div class="eyebrow">
        SMART CARPOOLING
    </div>

    <h1>
        Offer a ride.
    </h1>

    <p class="subtitle">
        Share your journey and help your network commute smarter.
    </p>


    <div class="switch">

        <a href="find-ride.html">
            Find Ride
        </a>

        <a
            href="offer-ride.html"
            class="active"
        >
            Offer Ride
        </a>

    </div>


    <section class="grid">

        <div class="card">

            <h2>
                Plan your journey
            </h2>


            <div class="location">

                <label>
                    Start Location
                </label>

                <div class="input">

                    <span class="dot"></span>

                    <input
                        id="start"
                        type="text"
                        autocomplete="off"
                        placeholder="Search Kolkata location..."
                    >

                </div>

                <div
                    id="startSuggestions"
                    class="suggestions"
                ></div>

            </div>


            <button
                id="swap"
                class="swap"
            >
                ⇅
            </button>


            <div class="location">

                <label>
                    Destination
                </label>

                <div class="input">

                    <span class="dot black"></span>

                    <input
                        id="destination"
                        type="text"
                        autocomplete="off"
                        placeholder="Where are you going?"
                    >

                </div>

                <div
                    id="destinationSuggestions"
                    class="suggestions"
                ></div>

            </div>


            <button
                class="current"
                id="current"
            >
                ◎ Use my current location
            </button>


            <div class="fields">

                <div class="field">

                    <label>
                        Travel Date
                    </label>

                    <input
                        type="date"
                        id="date"
                    >

                </div>


                <div class="field">

                    <label>
                        Departure Time
                    </label>

                    <input
                        type="time"
                        id="time"
                    >

                </div>


                <div class="field">

                    <label>
                        Available Seats
                    </label>

                    <select id="seats">

                        <option value="1">
                            1 Seat
                        </option>

                        <option value="2">
                            2 Seats
                        </option>

                        <option value="3">
                            3 Seats
                        </option>

                        <option value="4">
                            4 Seats
                        </option>

                    </select>

                </div>

            </div>


            <div class="vehicle">

                <label>
                    Your Vehicle
                </label>

                <select id="vehicle">

                    <option value="">
                        Select registered vehicle
                    </option>

                    <option>
                        Hyundai i20 • WB 02 AB 1234
                    </option>

                    <option>
                        Tata Nexon • WB 06 CD 5678
                    </option>

                    <option>
                        Honda City • WB 04 EF 9012
                    </option>

                </select>

            </div>


            <div class="fare">

                <div class="field">

                    <label>
                        Fare Per Seat
                    </label>

                    <input
                        type="number"
                        id="fare"
                        min="0"
                        placeholder="₹ Enter fare"
                    >

                </div>

            </div>


        
            


        <div class="map-card">

            <div class="map-head">

                <strong>
                    RideSync Route Preview
                </strong>

                <span id="status">
                    ● READY
                </span>

            </div>


            <div class="map">

                <div class="road"></div>
                <div class="road r2"></div>
                <div class="road r3"></div>

                <div
                    class="route"
                    id="route"
                ></div>

                <div
                    class="pin a"
                    id="pinA"
                >
                    A
                </div>

                <div
                    class="pin b"
                    id="pinB"
                >
                    B
                </div>

                <div
                    class="empty"
                    id="empty"
                >

                    <div>
                        ⌖
                    </div>

                    <strong>
                        Confirm your route
                    </strong>

                    <span>
                        Verified RideSync demo locations
                    </span>

                </div>

            </div>

        </div>

    </section>

</main>


<div
    class="toast"
    id="toast"
></div>


<script>
/* =========================================================
   RIDESYNC SHARED LOCATION DATA
   SAME STRUCTURE CAN LATER ACCEPT GOOGLE PLACE DATA
========================================================= */

const RIDESYNC_LOCATIONS = [

    {
        id:"kankurgachi",
        name:"Kankurgachi",
        address:"Kankurgachi, Kolkata",
        pincode:"700054",

        lng:88.3955
    },

    {
        id:"salt-lake-sector-v",

    },

    {

        pincode:"700156",

        lng:88.4797
    },

    {
        id:"city-centre-1",

    },

    {

        lng:88.4517
    },

    {
        id:"sealdah",
        name:"Sealdah",
        address:"Sealdah, Kolkata",
        pincode:"700014",
        lat:22.5646,
        lng:88.3704
    },

    {
        id:"howrah",
        name:"Howrah",
        address:"Howrah Station Area",
        pincode:"711101",
        lat:22.5839,
        lng:88.3426
    },

    {
        id:"esplanade",
        name:"Esplanade",
        address:"Esplanade, Kolkata",
        pincode:"700069",
        lat:22.5667,
        lng:88.3517
    },

    {
        id:"park-street",
        name:"Park Street",
        address:"Park Street, Kolkata",
        pincode:"700016",
        lat:22.5525,
        lng:88.3527
    },

    {
        id:"garia",
        name:"Garia",
        address:"Garia, Kolkata",
        pincode:"700084",
        lat:22.4635,
        lng:88.3914
    },

    {
        id:"jadavpur",
        name:"Jadavpur",
        address:"Jadavpur, Kolkata",
        pincode:"700032",
        lat:22.4986,
        lng:88.3714
    },

    {
        id:"tollygunge",
        name:"Tollygunge",
        address:"Tollygunge, Kolkata",
        pincode:"700033",
        lat:22.4989,
        lng:88.3467
    },

    {
        id:"ballygunge",
        name:"Ballygunge",
        address:"Ballygunge, Kolkata",
        pincode:"700019",
        lat:22.5277,
        lng:88.3660
    },

    {
        id:"dum-dum",
        name:"Dum Dum",
        address:"Dum Dum, Kolkata",
        pincode:"700080",
        lat:22.6226,
        lng:88.4156
    },

    {
        id:"airport",
        name:"Kolkata Airport",
        address:"NSCB International Airport Area",
        pincode:"700052",
        lat:22.6547,
        lng:88.4467
    },

    {
        id:"barasat",
        name:"Barasat",
        address:"Barasat, North 24 Parganas",
        pincode:"700124",
        lat:22.7225,
        lng:88.4800
    },

    {
        id:"shyambazar",
        name:"Shyambazar",
        address:"Shyambazar, Kolkata",
        pincode:"700004",
        lat:22.5993,
        lng:88.3731
    },

    {
        id:"behala",
        name:"Behala",
        address:"Behala, Kolkata",
        pincode:"700034",
        lat:22.5000,
        lng:88.3170
    },

    {
        id:"rajarhat",
        name:"Rajarhat",
        address:"Rajarhat, Kolkata",
        pincode:"700135",
        lat:22.6275,
        lng:88.4496
    },

    {
        id:"science-city",
        name:"Science City",
        address:"Science City, Kolkata",
        pincode:"700046",
        lat:22.5415,
        lng:88.3965
    }

];


/* =========================================================
   STATE
========================================================= */

let startLocation = null;
let destinationLocation = null;


/* =========================================================
   ELEMENTS
========================================================= */

const start =
    document.getElementById("start");

const destination =
    document.getElementById("destination");

const startSuggestions =
    document.getElementById("startSuggestions");

const destinationSuggestions =
    document.getElementById("destinationSuggestions");

const toast =
    document.getElementById("toast");


/* =========================================================
   DEFAULT DATE / TIME
========================================================= */

const now = new Date();

document.getElementById("date").value =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

document.getElementById("time").value =
    `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        2800
    );
}


/* =========================================================
   LOCATION SEARCH
========================================================= */

function findLocations(query){

    query =
        query.trim().toLowerCase();

    if(!query){

        return RIDESYNC_LOCATIONS.slice(0,8);

    }

    return RIDESYNC_LOCATIONS.filter(
        location =>

        location.name.toLowerCase()
        .includes(query)

        ||

        location.address.toLowerCase()
        .includes(query)

        ||

        location.pincode
        .includes(query)

    ).slice(0,8);
}


/* =========================================================
   SUGGESTIONS
========================================================= */

function showSuggestions(
    input,
    container,
    type
){

    const locations =
        findLocations(input.value);

    container.innerHTML = "";


    if(!locations.length){

        container.innerHTML = `

            <div class="suggestion">

                <div class="icon">
                    !
                </div>

                <div>

                    <strong>
                        Location not found
                    </strong>

                    <small>
                        Choose a verified RideSync location
                    </small>

                </div>

            </div>
        `;

        container.style.display =
            "block";

        return;
    }


    locations.forEach(
        location => {

            const item =
                document.createElement("div");

            item.className =
                "suggestion";

            item.innerHTML = `

                <div class="icon">
                    ⌖
                </div>

                <div>

                    <strong>
                        ${location.name}
                    </strong>

                    <small>
                        ${location.address} • ${location.pincode}
                    </small>

                </div>
            `;


            item.addEventListener(
                "mousedown",
                event => {

                    event.preventDefault();

                    input.value =
                        location.name;


                    if(type === "start"){

                        startLocation =
                            location;

                    }else{

                        destinationLocation =
                            location;

                    }


                    container.style.display =
                        "none";

                    updateRoute();

                }
            );


            container.appendChild(item);

        }
    );


    container.style.display =
        "block";
}


/* =========================================================
   INPUT EVENTS
========================================================= */

start.addEventListener(
    "input",
    ()=>{
        startLocation = null;

        showSuggestions(
            start,
            startSuggestions,
            "start"
        );
    }
);

destination.addEventListener(
    "input",
    ()=>{
        destinationLocation = null;

        showSuggestions(
            destination,
            destinationSuggestions,
            "destination"
        );
    }
);


start.addEventListener(
    "focus",
    ()=>{
        showSuggestions(
            start,
            startSuggestions,
            "start"
        );
    }
);

destination.addEventListener(
    "focus",
    ()=>{
        showSuggestions(
            destination,
            destinationSuggestions,
            "destination"
        );
    }
);


/* =========================================================
   CLOSE
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            !start.contains(event.target) &&
            !startSuggestions.contains(event.target)
        ){

            startSuggestions.style.display =
                "none";
        }


        if(
            !destination.contains(event.target) &&
            !destinationSuggestions.contains(event.target)
        ){

            destinationSuggestions.style.display =
                "none";
        }

    }
);


/* =========================================================
   SWAP
========================================================= */

document.getElementById("swap")
.addEventListener(
    "click",
    ()=>{

        const text =
            start.value;

        start.value =
            destination.value;

        destination.value =
            text;


        const location =
            startLocation;

        startLocation =
            destinationLocation;

        destinationLocation =
            location;


        updateRoute();

    }
);


/* =========================================================
   ROUTE PREVIEW
========================================================= */

function updateRoute(){

    const route =
        document.getElementById("route");

    const pinA =
        document.getElementById("pinA");

    const pinB =
        document.getElementById("pinB");

    const empty =
        document.getElementById("empty");

    const status =
        document.getElementById("status");


    if(
        startLocation &&
        destinationLocation
    ){

        route.style.display =
            "block";

        pinA.style.display =
            "grid";

        pinB.style.display =
            "grid";

        empty.style.display =
            "none";

        status.textContent =
            "● ROUTE READY";

    }else{

        route.style.display =
            "none";

        pinA.style.display =
            "none";

        pinB.style.display =
            "none";

        empty.style.display =
            "block";

        status.textContent =
            "● READY";

    }

}


/* =========================================================
   CURRENT LOCATION
========================================================= */

document.getElementById("current")
.addEventListener(
    "click",
    ()=>{

        if(!navigator.geolocation){

            showToast(
                "Your browser does not support GPS."
            );

            return;
        }


        showToast(
            "Detecting your current position..."
        );


        navigator.geolocation.getCurrentPosition(

            position => {

                start.value =
                    "Current Location";


                startLocation = {

                    id:"current-location",

                    name:"Current Location",

                    address:"Browser GPS location",

                    pincode:"",

                    lat:
                        position.coords.latitude,

                    lng:
                        position.coords.longitude

                };


                updateRoute();


                showToast(
                    "Current location detected."
                );

            },

            ()=>{
                showToast(
                    "Please allow location permission."
                );
            }

        );

    }
);


/* =========================================================
   OFFER RIDE
========================================================= */

document.getElementById("offer")
.addEventListener(
    "click",
    ()=>{

        if(!startLocation){

            showToast(
                "Select a verified start location."
            );

            start.focus();

            return;
        }


        if(!destinationLocation){

            showToast(
                "Select a verified destination."
            );

            destination.focus();

            return;
        }


        if(
            startLocation.id ===
            destinationLocation.id
        ){

            showToast(
                "Start and destination cannot be same."
            );

            return;
        }


        const vehicle =
            document.getElementById("vehicle").value;

        const fare =
            document.getElementById("fare").value;


        if(!vehicle){

            showToast(
                "Please select your vehicle."
            );

            return;
        }


        if(!fare || Number(fare) < 0){

            showToast(
                "Enter a valid fare per seat."
            );

            return;
        }


        const rideData = {

            start:startLocation,

            destination:destinationLocation,

            date:
                document.getElementById("date").value,

            time:
                document.getElementById("time").value,

            seats:
                document.getElementById("seats").value,

            vehicle:vehicle,

            fare:Number(fare),

            status:"OFFERED"

        };


        /*
         Future backend/API integration:

         rideData.start.lat
         rideData.start.lng
         rideData.destination.lat
         rideData.destination.lng

         Google Maps can later consume these
         exact same fields.
        */


        localStorage.setItem(
            "ridesync_offered_ride",
            JSON.stringify(rideData)
        );


        showToast(
            "Ride successfully prepared for publishing."
        );


        console.log(
            "RideSync Offer Ride:",
            rideData
        );

    }
);

}
