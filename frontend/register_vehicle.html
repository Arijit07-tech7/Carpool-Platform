<script>

    /*
     * Vehicle Type Selection
     */
    const vehicleCards =
        document.querySelectorAll(".type-card");

    const vehicleInputs =
        document.querySelectorAll(
            'input[name="vehicle_type"]'
        );


    vehicleInputs.forEach(function (input) {

        input.addEventListener("change", function () {

            /*
             * Remove selected state from all cards
             */
            vehicleCards.forEach(function (card) {

                card.classList.remove("selected");

                const indicator =
                    card.querySelector(
                        ".selection-indicator"
                    );

                indicator.classList.remove(
                    "bg-primary",
                    "text-white"
                );

                indicator.classList.add(
                    "border-2",
                    "border-outline"
                );

                indicator.innerHTML = "";

            });


            /*
             * Add selected state to current card
             */
            const selectedCard =
                input.closest(".type-card");

            selectedCard.classList.add("selected");


            const selectedIndicator =
                selectedCard.querySelector(
                    ".selection-indicator"
                );


            selectedIndicator.classList.remove(
                "border-2",
                "border-outline"
            );

            selectedIndicator.classList.add(
                "bg-primary",
                "text-white"
            );


            selectedIndicator.innerHTML = `
                <span class="material-icons-outlined text-sm">
                    check
                </span>
            `;

        });

    });


    /*
     * Continue to Step 2
     */
    function continueToDetails() {

        const selectedVehicle =
            document.querySelector(
                'input[name="vehicle_type"]:checked'
            );


        if (!selectedVehicle) {

            alert(
                "Please select a vehicle type first."
            );

            return;
        }


        const vehicleType =
            selectedVehicle.value;


        /*
         * Store selection for the next step.
         * This can later be replaced with a backend/API call.
         */
        localStorage.setItem(
            "ridesync_vehicle_type",
            vehicleType
        );


        /*
         * Temporary demonstration.
         * Replace this with your Step 2 page URL.
         */
        alert(
            `You selected: ${
                vehicleType.charAt(0).toUpperCase() +
                vehicleType.slice(1)
            }\n\nProceeding to vehicle details...`
        );

    }


    /*
     * Back Button
     */
    function goBack() {

        /*
         * If browser history exists, go back.
         * Otherwise show a message.
         */
        if (window.history.length > 1) {

            window.history.back();

        } else {

            alert(
                "There is no previous page."
            );

        }

    }

</script>
