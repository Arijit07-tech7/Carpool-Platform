<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="RideSync Smart Mobility Platform"
    >

    <title>RideSync — Smart Mobility</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --white: #ffffff;
            --black: #080a0d;
            --blue: #1677ff;
            --blue-light: #4da3ff;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Inter", sans-serif;
            background: #ffffff;
        }


        body {
            position: relative;
        }


        /* =====================================================
           SPLASH BACKGROUND
        ===================================================== */

        .splash-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(35, 132, 255, .17),
                    transparent 32%
                ),
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f5f8fc 48%,
                    #e9eef5 100%
                );
        }


        /* Soft city glow */

        .city-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(
                    circle,
                    rgba(20, 120, 255, .18),
                    rgba(20, 120, 255, .05) 35%,
                    transparent 70%
                );
            filter: blur(25px);
            animation: cityPulse 4s ease-in-out infinite;
        }


        @keyframes cityPulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(.92);
                opacity: .55;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.08);
                opacity: 1;
            }

        }


        /* =====================================================
           ROAD
        ===================================================== */

        .road-perspective {
            position: absolute;
            width: 72vw;
            height: 80vh;
            left: 50%;
            bottom: -36vh;
            transform:
                translateX(-50%)
                perspective(500px)
                rotateX(62deg);

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(0, 0, 0, .035) 25%,
                    rgba(0, 0, 0, .12) 50%,
                    rgba(0, 0, 0, .035) 75%,
                    transparent 100%
                );

            border-left: 1px solid rgba(0, 0, 0, .04);
            border-right: 1px solid rgba(0, 0, 0, .04);
        }


        .road-line {
            position: absolute;
            width: 4px;
            height: 180px;
            left: 50%;
            bottom: -220px;
            border-radius: 100px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(20, 20, 20, .65),
                    transparent
                );

            transform-origin: center;
            animation: roadMove 1.4s linear infinite;
        }


        .road-line-1 {
            animation-delay: 0s;
        }


        .road-line-2 {
            animation-delay: .45s;
        }


        .road-line-3 {
            animation-delay: .9s;
        }


        @keyframes roadMove {

            0% {
                transform:
                    translate(-50%, 0)
                    scale(.2);
                opacity: 0;
            }

            20% {
                opacity: .8;
            }

            100% {
                transform:
                    translate(-50%, -100vh)
                    scale(2.8);
                opacity: 0;
            }

        }


        /* =====================================================
           SPEED LIGHTS
        ===================================================== */

        .speed-light {
            position: absolute;
            width: 2px;
            height: 120px;
            border-radius: 100px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(22, 119, 255, .75),
                    transparent
                );

            filter: blur(.5px);
            animation: speedMove 2.3s linear infinite;
        }


        .light-1 {
            left: 24%;
            bottom: -150px;
            animation-delay: .2s;
        }

        .light-2 {
            left: 36%;
            bottom: -200px;
            animation-delay: 1s;
        }

        .light-3 {
            right: 30%;
            bottom: -170px;
            animation-delay: .55s;
        }

        .light-4 {
            right: 20%;
            bottom: -230px;
            animation-delay: 1.4s;
        }


        @keyframes speedMove {

            0% {
                transform: translateY(0) scale(.4);
                opacity: 0;
            }

            15% {
                opacity: .8;
            }

            100% {
                transform: translateY(-110vh) scale(1.8);
                opacity: 0;
            }

        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .splash-overlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(255,255,255,.08) 35%,
                    rgba(255,255,255,.58) 100%
                );

            pointer-events: none;
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .splash-content {
            position: relative;
            z-index: 10;

            width: min(520px, 90%);
            height: 100vh;

            margin: auto;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-container {
            margin-bottom: 25px;

            animation:
                logoEntrance 1.1s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        .logo-square {
            width: 82px;
            height: 82px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #050505,
                    #20242a
                );

            box-shadow:
                0 25px 60px rgba(0,0,0,.2),
                0 0 0 1px rgba(255,255,255,.18) inset,
                0 0 40px rgba(22,119,255,.18);

            transform: rotate(-5deg);
        }


        .logo-square span {
            color: white;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -4px;
            transform: rotate(5deg);
        }


        @keyframes logoEntrance {

            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(.7)
                    rotate(-12deg);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1)
                    rotate(0);
            }

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            animation:
                brandEntrance 1s
                .25s
                both
                cubic-bezier(.2,.8,.2,1);
        }


        .brand h1 {
            font-size: clamp(42px, 9vw, 68px);
            line-height: 1;
            letter-spacing: -4px;
            font-weight: 900;
            color: #080a0d;
        }


        .brand h1 span {
            color: var(--blue);
        }


        .brand p {
            margin-top: 13px;

            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;

            color: #697386;
        }


        @keyframes brandEntrance {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           LOADER
        ===================================================== */

        .journey-loader {
            width: min(400px, 85vw);
            margin-top: 65px;

            animation:
                loaderEntrance 1s
                .5s
                both;
        }


        .loader-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #7a8494;
        }


        #loaderPercent {
            color: #080a0d;
        }


        .loader-track {
            position: relative;
            height: 5px;

            overflow: hidden;
            border-radius: 100px;

            background: rgba(0,0,0,.08);
        }


        .loader-progress {
            position: absolute;
            left: 0;
            top: 0;

            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #050505,
                    #1677ff
                );

            box-shadow:
                0 0 18px rgba(22,119,255,.45);
        }


        @keyframes loaderEntrance {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .splash-message {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-top: 24px;

            color: #697386;

            font-size: 12px;
            font-weight: 600;
        }


        .pulse-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #1677ff;

            box-shadow:
                0 0 0 0 rgba(22,119,255,.4);

            animation: pulse 1.7s infinite;
        }


        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 0 0 rgba(22,119,255,.45);
            }

            70% {
                box-shadow:
                    0 0 0 9px rgba(22,119,255,0);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(22,119,255,0);
            }

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .splash-footer {
            position: fixed;

            left: 50%;
            bottom: 28px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 10px;

            z-index: 20;

            white-space: nowrap;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2px;

            color: #8b95a5;
        }


        .footer-dot {
            color: #1677ff;
        }


        /* =====================================================
           EXIT ANIMATION
        ===================================================== */

        body.exit .splash-content {
            animation:
                splashExit .8s
                forwards;
        }


        body.exit .splash-background {
            animation:
                backgroundExit .8s
                forwards;
        }


        @keyframes splashExit {

            to {
                opacity: 0;
                transform: scale(1.04);
            }

        }


        @keyframes backgroundExit {

            to {
                transform: scale(1.08);
                opacity: 0;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .logo-square {
                width: 70px;
                height: 70px;
                border-radius: 20px;
            }

            .logo-square span {
                font-size: 36px;
            }

            .brand h1 {
                letter-spacing: -3px;
            }

            .journey-loader {
                margin-top: 50px;
            }

            .splash-footer {
                bottom: 20px;
                font-size: 7px;
                letter-spacing: 1.4px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CINEMATIC BACKGROUND
    ====================================================== -->

    <div class="splash-background">

        <div class="city-glow"></div>

        <div class="road-perspective"></div>

        <div class="road-line road-line-1"></div>

        <div class="road-line road-line-2"></div>

        <div class="road-line road-line-3"></div>

        <div class="speed-light light-1"></div>

        <div class="speed-light light-2"></div>

        <div class="speed-light light-3"></div>

        <div class="speed-light light-4"></div>

    </div>


    <div class="splash-overlay"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="splash-content">


        <div class="logo-container">

            <div class="logo-square">

                <span>R</span>

            </div>

        </div>


        <div class="brand">

            <h1>
                Ride<span>Sync</span>
            </h1>

            <p>
                CONNECT • SHARE • MOVE
            </p>

        </div>


        <div class="journey-loader">

            <div class="loader-top">

                <span>
                    STARTING JOURNEY
                </span>

                <span id="loaderPercent">
                    0%
                </span>

            </div>


            <div class="loader-track">

                <div
                    id="loaderProgress"
                    class="loader-progress"
                ></div>

            </div>

        </div>


        <div class="splash-message">

            <span class="pulse-dot"></span>

            Preparing your RideSync experience

        </div>


    </main>


    <footer class="splash-footer">

        <span>RIDESYNC</span>

        <span class="footer-dot">•</span>

        <span>SMART MOBILITY PLATFORM</span>

    </footer>


    <script>

        const progress =
            document.getElementById("loaderProgress");

        const percent =
            document.getElementById("loaderPercent");


        let value = 0;


        /*
         * Smooth cinematic loading
         */

        const loadingTimer =
            setInterval(() => {

                value += Math.random() * 4 + 1;

                if (value >= 100) {

                    value = 100;

                    clearInterval(loadingTimer);

                    progress.style.width = "100%";
                    percent.textContent = "100%";


                    setTimeout(() => {

                        document.body.classList.add("exit");

                        setTimeout(() => {

                            window.location.href =
                                "login.html";

                        }, 750);

                    }, 350);

                    return;
                }


                progress.style.width =
                    value + "%";

                percent.textContent =
                    Math.floor(value) + "%";

            }, 70);


    </script>

</body>

</html>
